<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>杜绝加密</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='12' fill='%23e0332f'/%3E%3Ctext x='50' y='50' font-size='58' fill='%23fff' text-anchor='middle' dominant-baseline='central' font-family='serif'%3E杜%3C/text%3E%3C/svg%3E">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    min-height: 100vh;
    background: #0a0a0c;
    color: #ececef;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    -webkit-font-smoothing: antialiased;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 40px 22px;
  }

  .seal {
    width: 72px;
    height: 72px;
    display: block;
    margin-bottom: 22px;
  }

  h1 {
    font-family: "Songti SC", "STSong", "SimSun", serif;
    font-size: 30px;
    font-weight: 700;
    letter-spacing: 4px;
    margin-bottom: 10px;
  }

  .sub {
    font-size: 13px;
    color: #86868f;
    letter-spacing: 1px;
    margin-bottom: 38px;
  }

  .links {
    display: flex;
    flex-direction: column;
    gap: 10px;
    width: 100%;
    max-width: 300px;
  }

  .item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 15px 16px;
    background: #131317;
    border: 1px solid #26262d;
    border-radius: 10px;
    color: inherit;
    text-decoration: none;
    font-size: 15px;
    font-family: inherit;
    text-align: left;
    cursor: pointer;
    transition: border-color .18s, background .18s;
  }
  .item:hover { background: #1b1b21; border-color: #38383f; }

  .item .ic {
    width: 30px;
    height: 30px;
    flex-shrink: 0;
    display: grid;
    place-items: center;
    border-radius: 6px;
    border: 1.5px solid currentColor;
  }
  .item .ic svg { width: 15px; height: 15px; }
  .ic.a { color: #6fb3d9; background: rgba(111,179,217,.1); }
  .ic.b { color: #9b8ec4; background: rgba(155,142,196,.1); }

  .item .txt { flex: 1; min-width: 0; }
  .item .tag {
    font-size: 11px;
    color: #e0332f;
    border: 1px solid rgba(224,51,47,.4);
    border-radius: 4px;
    padding: 2px 6px;
    display: inline-flex;
    align-items: center;
    gap: 3px;
  }
  .item .tag svg { width: 9px; height: 9px; }

  footer {
    margin-top: 44px;
    font-size: 11.5px;
    color: #5c5c66;
  }

  /* 密码弹窗 */
  .modal {
    position: fixed;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 20px;
    background: rgba(0,0,0,.72);
    backdrop-filter: blur(3px);
    z-index: 50;
  }
  .modal.show { display: flex; }

  .card {
    width: 100%;
    max-width: 330px;
    background: #16161b;
    border: 1px solid #38383f;
    border-radius: 12px;
    padding: 22px;
  }
  .card h2 {
    font-size: 15px;
    font-weight: 600;
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .card h2 svg { color: #e0332f; flex-shrink: 0; }

  #pw {
    width: 100%;
    padding: 11px 13px;
    background: #0a0a0c;
    border: 1px solid #26262d;
    border-radius: 8px;
    color: #ececef;
    font-size: 16px;
    font-family: inherit;
    outline: none;
  }
  #pw:focus { border-color: #a8231f; }

  .err {
    height: 17px;
    margin-top: 6px;
    font-size: 12px;
    color: #ff6b66;
    opacity: 0;
    transition: opacity .15s;
  }
  .err.show { opacity: 1; }

  .acts { display: flex; gap: 9px; margin-top: 6px; }
  .btn {
    flex: 1;
    padding: 10px;
    font-size: 13.5px;
    font-family: inherit;
    border-radius: 8px;
    cursor: pointer;
    border: 1px solid #26262d;
    background: transparent;
    color: #86868f;
    transition: color .18s, border-color .18s;
  }
  .btn:hover { color: #ececef; border-color: #38383f; }
  .btn.primary {
    background: #e0332f;
    border-color: #e0332f;
    color: #fff;
    font-weight: 600;
  }
  .btn.primary:hover { background: #f0443f; border-color: #f0443f; }

  @keyframes shake {
    0%,100% { transform: translateX(0); }
    25% { transform: translateX(-6px); }
    75% { transform: translateX(6px); }
  }
  .shake { animation: shake .3s; }

  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>

<img class="seal" src="assets/avatar.png" alt="杜绝加密">
<h1>杜绝加密</h1>
<p class="sub">站点整理中</p>

<div class="links">
  <a class="item" href="https://radio.mydjjm.cn" target="_blank" rel="noopener">
    <span class="ic a">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="22"/>
      </svg>
    </span>
    <span class="txt">电台</span>
  </a>

  <button class="item" type="button" id="treeBtn">
    <span class="ic b">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 21h18M5 21V7l7-4 7 4v14M9 21v-6h6v6"/>
      </svg>
    </span>
    <span class="txt">族谱</span>
    <span class="tag">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
      加密
    </span>
  </button>
</div>

<footer>© 2026 杜绝加密</footer>

<div class="modal" id="modal" role="dialog" aria-modal="true">
  <div class="card" id="card">
    <h2>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
      族谱需要密码
    </h2>
    <input id="pw" type="password" placeholder="密码" autocomplete="off" spellcheck="false">
    <div class="err" id="err">密码不对，再试一次</div>
    <div class="acts">
      <button class="btn" type="button" id="btnCancel">取消</button>
      <button class="btn primary" type="button" id="btnOk">打开</button>
    </div>
  </div>
</div>

<script>
/* 族谱链接以 AES-GCM 加密保存，源码中没有密码与真实地址 */
const ENC = { salt: 'fyfZqoWZ7Tv60rKHi7k1HQ==', iv: 'llH2E/skyASQZf3i', ct: 'nnsy+QejN/a4SQkv5rHFVE8blhxMIM50P01lmlF13tMP7h10s+g=', iter: 210000 };

const modal = document.getElementById('modal');
const card = document.getElementById('card');
const pw = document.getElementById('pw');
const err = document.getElementById('err');

function b64ToBytes(b64) {
  const bin = atob(b64);
  const out = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
  return out;
}

async function decryptUrl(password) {
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(password), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey(
    { name: 'PBKDF2', salt: b64ToBytes(ENC.salt), iterations: ENC.iter, hash: 'SHA-256' },
    base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']
  );
  const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64ToBytes(ENC.iv) }, key, b64ToBytes(ENC.ct));
  return new TextDecoder().decode(plain);
}

function openModal() {
  pw.value = '';
  err.classList.remove('show');
  modal.classList.add('show');
  setTimeout(() => pw.focus(), 50);
}
function closeModal() { modal.classList.remove('show'); }

async function submit() {
  const v = pw.value;
  if (!v) { pw.focus(); return; }
  err.classList.remove('show');

  if (!(window.crypto && crypto.subtle)) {
    err.textContent = '当前环境不支持解密，请用 https 访问';
    err.classList.add('show');
    return;
  }

  try {
    const url = await decryptUrl(v);
    closeModal();
    window.open(url, '_blank', 'noopener');
  } catch (e) {
    err.textContent = '密码不对，再试一次';
    err.classList.add('show');
    card.classList.add('shake');
    setTimeout(() => card.classList.remove('shake'), 320);
    pw.select();
  }
}

document.getElementById('treeBtn').addEventListener('click', openModal);
document.getElementById('btnOk').addEventListener('click', submit);
document.getElementById('btnCancel').addEventListener('click', closeModal);
pw.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); submit(); } });
modal.addEventListener('click', e => { if (e.target === modal) closeModal(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });
</script>

</body>
</html>
