<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>杜绝加密 · 影视导航</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='12' fill='%23e0332f'/%3E%3Ctext x='50' y='50' font-size='58' fill='%23fff' text-anchor='middle' dominant-baseline='central' font-family='serif'%3E杜%3C/text%3E%3C/svg%3E">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0a0a0c;
    --surface: #131317;
    --surface-hi: #1b1b21;
    --border: #26262d;
    --border-hi: #38383f;
    --text: #ececef;
    --muted: #86868f;
    --seal: #e0332f;
    --seal-dim: #a8231f;
    --amber: #f0a04b;
  }

  html { -webkit-text-size-adjust: 100%; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
    padding-bottom: 40px;
  }

  /* 顶栏 */
  .topbar {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 16px 20px;
    max-width: 1080px;
    margin: 0 auto;
  }
  .seal {
    width: 30px;
    height: 30px;
    display: block;
    flex-shrink: 0;
  }
  .brand {
    font-family: "Songti SC", "STSong", "SimSun", serif;
    font-size: 17px;
    font-weight: 700;
    letter-spacing: 1px;
  }
  .brand-sub {
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 2px;
    margin-left: 2px;
    padding-left: 10px;
    border-left: 1px solid var(--border);
  }

  /* 主容器 */
  .wrap {
    max-width: 1080px;
    margin: 0 auto;
    padding: 0 20px;
  }

  /* 标题区 */
  .hero {
    padding: 12px 0 26px;
  }
  .hero h1 {
    font-family: "Songti SC", "STSong", "SimSun", serif;
    font-size: 30px;
    font-weight: 700;
    letter-spacing: 3px;
    line-height: 1.2;
  }
  .hero p {
    margin-top: 8px;
    font-size: 13px;
    color: var(--muted);
  }

  /* 搜索 */
  .search-box {
    position: relative;
    margin-bottom: 22px;
  }
  .search-box svg {
    position: absolute;
    left: 16px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--muted);
    pointer-events: none;
  }
  #q {
    width: 100%;
    padding: 14px 16px 14px 46px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    color: var(--text);
    font-size: 16px;
    font-family: inherit;
    outline: none;
    transition: border-color .18s;
  }
  #q::placeholder { color: #5c5c66; }
  #q:focus { border-color: var(--seal-dim); }

  /* 分类 */
  .chips {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    padding-bottom: 4px;
    margin-bottom: 20px;
    scrollbar-width: none;
  }
  .chips::-webkit-scrollbar { display: none; }
  .chip {
    flex-shrink: 0;
    padding: 7px 15px;
    font-size: 13px;
    color: var(--muted);
    background: transparent;
    border: 1px solid var(--border);
    border-radius: 999px;
    cursor: pointer;
    font-family: inherit;
    transition: color .18s, border-color .18s, background .18s;
  }
  .chip:hover { color: var(--text); border-color: var(--border-hi); }
  .chip[aria-pressed="true"] {
    color: #fff;
    background: var(--seal);
    border-color: var(--seal);
  }

  /* 网格 */
  .grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: 10px;
  }

  .tile {
    display: flex;
    align-items: flex-start;
    gap: 13px;
    padding: 15px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    text-decoration: none;
    color: inherit;
    transition: border-color .18s, background .18s, transform .18s;
  }
  .tile:hover {
    background: var(--surface-hi);
    border-color: var(--border-hi);
    transform: translateY(-2px);
  }
  .tile:hover .tile-name { color: #fff; }

  .mk {
    width: 40px;
    height: 40px;
    flex-shrink: 0;
    border-radius: 7px;
    display: grid;
    place-items: center;
    font-family: "Songti SC", "STSong", "SimSun", serif;
    font-size: 19px;
    font-weight: 700;
    border: 1.5px solid currentColor;
  }
  .mk.c1 { color: #e5736f; background: rgba(224,51,47,.1); }
  .mk.c2 { color: #f0a04b; background: rgba(240,160,75,.1); }
  .mk.c3 { color: #6fb3d9; background: rgba(111,179,217,.1); }
  .mk.c4 { color: #9b8ec4; background: rgba(155,142,196,.1); }

  .tile-body { flex: 1; min-width: 0; }
  .tile-name {
    font-size: 14.5px;
    font-weight: 600;
    margin-bottom: 2px;
    transition: color .18s;
  }
  .tile-desc {
    font-size: 12.5px;
    color: var(--muted);
    line-height: 1.5;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .tile-tag {
    flex-shrink: 0;
    align-self: center;
    font-size: 11px;
    color: #5c5c66;
    padding: 3px 8px;
    border: 1px solid var(--border);
    border-radius: 4px;
    white-space: nowrap;
  }

  /* 精选 */
  .tile.featured {
    grid-column: 1 / -1;
    border-color: var(--seal-dim);
    background: linear-gradient(135deg, rgba(224,51,47,.08), var(--surface) 55%);
  }
  .tile.featured .mk {
    width: 46px;
    height: 46px;
    font-size: 21px;
  }
  .tile.featured .tile-name { font-size: 16px; }

  /* 空态 */
  .empty {
    display: none;
    padding: 48px 16px;
    text-align: center;
    color: var(--muted);
    font-size: 13.5px;
    border: 1px dashed var(--border);
    border-radius: 10px;
  }
  .empty.show { display: block; }

  /* 提示 */
  .hint {
    margin-top: 26px;
    padding: 14px 16px;
    background: var(--surface);
    border-left: 2px solid var(--border-hi);
    border-radius: 0 8px 8px 0;
    font-size: 12.5px;
    color: var(--muted);
    line-height: 1.65;
  }
  .hint code {
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-size: 11.5px;
    color: var(--amber);
    background: rgba(240,160,75,.08);
    padding: 1px 5px;
    border-radius: 3px;
  }

  /* 页脚 */
  footer {
    max-width: 1080px;
    margin: 40px auto 0;
    padding: 18px 20px 0;
    border-top: 1px solid var(--border);
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    justify-content: space-between;
    font-size: 11.5px;
    color: #5c5c66;
  }
  footer a { color: #5c5c66; text-decoration: none; }
  footer a:hover { color: var(--muted); }

  /* 提示条 */
  #toast {
    position: fixed;
    bottom: 26px;
    left: 50%;
    transform: translateX(-50%) translateY(60px);
    background: var(--surface-hi);
    color: var(--text);
    border: 1px solid var(--border-hi);
    padding: 9px 18px;
    border-radius: 8px;
    font-size: 12.5px;
    opacity: 0;
    pointer-events: none;
    transition: opacity .25s, transform .25s;
    z-index: 99;
    max-width: 90vw;
  }

  /* 桌面 */
  @media (min-width: 640px) {
    .grid { grid-template-columns: repeat(2, 1fr); gap: 12px; }
    .hero h1 { font-size: 36px; }
    .tile { padding: 16px; }
  }
  @media (min-width: 900px) {
    .grid { grid-template-columns: repeat(3, 1fr); }
    .tile.featured { grid-column: span 2; }
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
    .tile:hover { transform: none; }
  }
</style>
</head>
<body>

<div class="topbar">
  <img class="seal" src="assets/avatar.png" alt="杜绝加密">
  <span class="brand">杜绝加密</span>
  <span class="brand-sub">影视导航</span>
</div>

<div class="wrap">

  <div class="hero">
    <h1>看片，从这里进</h1>
    <p id="count">正片平台、评分社区、短视频与自有应用，一处收录。</p>
  </div>

  <div class="search-box">
    <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
      <circle cx="11" cy="11" r="7"/><line x1="16.5" y1="16.5" x2="21" y2="21"/>
    </svg>
    <input id="q" type="search" placeholder="搜索平台、影片或类型…" autocomplete="off">
  </div>

  <div class="chips" id="chips"></div>

  <div class="grid" id="grid"></div>
  <div class="empty" id="empty">没有匹配的站点，换个关键词试试。</div>

  <div class="hint">
    想加站点？编辑 <code>index.html</code> 里的 <code>SITES</code> 数组，一条记录就是一张卡片：<code>name / desc / href / cat / tag / mark</code>。
  </div>

</div>

<footer>
  <span>© 2026 杜绝加密</span>
  <span><a href="https://github.com/qinvision">GitHub</a> · <a href="https://mydjjm.cn">mydjjm.cn</a></span>
</footer>

<div id="toast"></div>

<script>
/* ===== 数据 ===== */
const CATS = [
  { id: 'all',    label: '全部' },
  { id: 'video',  label: '综合平台' },
  { id: 'rating', label: '评分社区' },
  { id: 'short',  label: '短视频' },
  { id: 'mine',   label: '我的应用' }
];

const SITES = [
  { name: '影视 TV', desc: '自建影视播放应用，适配电视大屏，支持 iPhone 与安卓端。', href: 'https://github.com/qinvision', cat: 'mine', tag: '自有', mark: '视', featured: true },
  { name: '电台 App', desc: '多端电台收听，手机与电视通用。', href: 'https://radio.mydjjm.cn', cat: 'mine', tag: '自有', mark: '电' },
  { name: '族谱 · 家谱', desc: '家族谱系查询与世系图展示。', href: 'https://zupu.mydjjm.cn', cat: 'mine', tag: '自有', mark: '谱' },

  { name: '爱奇艺', desc: '长视频平台，院线新片、剧集与综艺覆盖最全。', href: 'https://www.iqiyi.com', cat: 'video', tag: '会员', mark: '爱' },
  { name: '腾讯视频', desc: '剧集与自制综艺为主，独播内容多。', href: 'https://v.qq.com', cat: 'video', tag: '会员', mark: '腾' },
  { name: '优酷', desc: '老片库厚，港剧与经典电影资源多。', href: 'https://www.youku.com', cat: 'video', tag: '会员', mark: '优' },
  { name: '芒果 TV', desc: '综艺见长，青春剧与自制内容集中。', href: 'https://www.mgtv.com', cat: 'video', tag: '会员', mark: '芒' },
  { name: '哔哩哔哩', desc: '番剧、纪录片与二创生态，弹幕氛围。', href: 'https://www.bilibili.com', cat: 'video', tag: '免费', mark: 'B' },
  { name: 'Netflix', desc: '海外剧集与电影，原创内容质量高。', href: 'https://www.netflix.com', cat: 'video', tag: '海外', mark: 'N' },
  { name: 'YouTube', desc: '全球视频平台，预告片、幕后与影评频道齐全。', href: 'https://www.youtube.com', cat: 'video', tag: '海外', mark: 'Y' },

  { name: '豆瓣电影', desc: '评分、影评与各类榜单，选片先看这里。', href: 'https://movie.douban.com', cat: 'rating', tag: '评分', mark: '豆' },
  { name: '猫眼电影', desc: '院线排片、票房数据与购票信息。', href: 'https://www.maoyan.com', cat: 'rating', tag: '票房', mark: '猫' },
  { name: 'IMDb', desc: '全球影视资料库，查演员、剧组与技术参数。', href: 'https://www.imdb.com', cat: 'rating', tag: '资料', mark: 'I' },
  { name: 'TMDB', desc: '开放影视数据库，接口友好，元数据齐全。', href: 'https://www.themoviedb.org', cat: 'rating', tag: '资料', mark: 'T' },

  { name: '抖音', desc: '短剧与影视解说，竖屏观看。', href: 'https://www.douyin.com', cat: 'short', tag: '竖屏', mark: '抖' },
  { name: '快手', desc: '短剧与生活类视频，地域内容多。', href: 'https://www.kuaishou.com', cat: 'short', tag: '竖屏', mark: '快' },
  { name: '西瓜视频', desc: '横屏中长视频，影视解说与纪录片合集。', href: 'https://www.ixigua.com', cat: 'short', tag: '横屏', mark: '西' }
];

/* ===== 渲染 ===== */
const gridEl = document.getElementById('grid');
const chipsEl = document.getElementById('chips');
const emptyEl = document.getElementById('empty');
const qEl = document.getElementById('q');
const countEl = document.getElementById('count');

let activeCat = 'all';
let keyword = '';

const MARK_CLASS = { video: 'c1', rating: 'c2', short: 'c3', mine: 'c4' };

function renderChips() {
  chipsEl.innerHTML = '';
  CATS.forEach(c => {
    const b = document.createElement('button');
    b.className = 'chip';
    b.type = 'button';
    b.textContent = c.label;
    b.setAttribute('aria-pressed', String(c.id === activeCat));
    b.addEventListener('click', () => {
      activeCat = c.id;
      renderChips();
      renderGrid();
    });
    chipsEl.appendChild(b);
  });
}

function match(s) {
  if (activeCat !== 'all' && s.cat !== activeCat) return false;
  if (!keyword) return true;
  const hay = (s.name + s.desc + s.tag).toLowerCase();
  return hay.includes(keyword);
}

function renderGrid() {
  const list = SITES.filter(match);
  gridEl.innerHTML = '';

  list.forEach(s => {
    const a = document.createElement('a');
    a.className = 'tile' + (s.featured && activeCat === 'all' && !keyword ? ' featured' : '');
    a.href = s.href;
    a.target = '_blank';
    a.rel = 'noopener';

    const mk = document.createElement('span');
    mk.className = 'mk ' + (MARK_CLASS[s.cat] || 'c1');
    mk.textContent = s.mark;

    const body = document.createElement('span');
    body.className = 'tile-body';
    const nm = document.createElement('span');
    nm.className = 'tile-name';
    nm.textContent = s.name;
    const ds = document.createElement('span');
    ds.className = 'tile-desc';
    ds.textContent = s.desc;
    body.appendChild(nm);
    body.appendChild(ds);

    const tg = document.createElement('span');
    tg.className = 'tile-tag';
    tg.textContent = s.tag;

    a.appendChild(mk);
    a.appendChild(body);
    a.appendChild(tg);
    gridEl.appendChild(a);
  });

  emptyEl.classList.toggle('show', list.length === 0);

  const catLabel = (CATS.find(c => c.id === activeCat) || CATS[0]).label;
  countEl.textContent = keyword
    ? `“${keyword}” 匹配到 ${list.length} 个站点`
    : `${catLabel} · 共 ${list.length} 个站点`;
}

qEl.addEventListener('input', e => {
  keyword = e.target.value.trim().toLowerCase();
  renderGrid();
});

renderChips();
renderGrid();

/* 提示条 */
const toastEl = document.getElementById('toast');
let toastTimer = null;
function toast(msg) {
  toastEl.textContent = msg;
  toastEl.style.opacity = '1';
  toastEl.style.transform = 'translateX(-50%) translateY(0)';
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => {
    toastEl.style.opacity = '0';
    toastEl.style.transform = 'translateX(-50%) translateY(60px)';
  }, 2200);
}
</script>

</body>
</html>
