<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>杜绝加密</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='12' fill='%23e0332f'/%3E%3Ctext x='50' y='50' font-size='58' fill='%23fff' text-anchor='middle' dominant-baseline='central' font-family='serif'%3E杜%3C/text%3E%3C/svg%3E">
<script>
/* 主题先于绘制应用，避免闪白 */
(function(){
  var T = {
    charcoal:{bg:'#0a0a0c',panel:'#131317',hover:'#1b1b21',line:'#26262d',line2:'#38383f',ink:'#ececef',dim:'#86868f',dim2:'#5c5c66',accent:'#e0332f'},
    indigo:{bg:'#080b14',panel:'#111827',hover:'#172033',line:'#1e293b',line2:'#334155',ink:'#e8eefc',dim:'#93a3bd',dim2:'#64748b',accent:'#5b8cff'},
    forest:{bg:'#07110c',panel:'#0f1a14',hover:'#14241b',line:'#1f3328',line2:'#2f4a3b',ink:'#e6f5ec',dim:'#8fb3a0',dim2:'#5f7d6c',accent:'#34b37a'},
    cocoa:{bg:'#120f0b',panel:'#1c1712',hover:'#241d16',line:'#332820',line2:'#4a3a2c',ink:'#f3e9dd',dim:'#b4a08b',dim2:'#7d6a58',accent:'#d98b4a'},
    violet:{bg:'#0d0916',panel:'#171022',hover:'#1d1429',line:'#2e2140',line2:'#42345a',ink:'#f0e9fb',dim:'#b3a4cb',dim2:'#7c6a95',accent:'#a06bff'},
    teal:{bg:'#0a0f12',panel:'#121a1f',hover:'#18232a',line:'#24323b',line2:'#33454f',ink:'#e6f1f5',dim:'#9db0ba',dim2:'#6b7f89',accent:'#38b8ae'},
    amber:{bg:'#100d06',panel:'#191408',hover:'#1f190c',line:'#332b17',line2:'#4a3f22',ink:'#f8f0da',dim:'#bfae86',dim2:'#8a7a55',accent:'#e0a92b'},
    paper:{bg:'#f5f4f1',panel:'#ffffff',hover:'#f0efec',line:'#e2e0da',line2:'#cfccc4',ink:'#1b1b1e',dim:'#6b6b73',dim2:'#8f8f98',accent:'#c0392b'}
  };
  window.__THEMES = T;
  var id = 'charcoal';
  try { id = localStorage.getItem('site.theme') || 'charcoal'; } catch(e){}
  if (!T[id]) id = 'charcoal';
  var t = T[id], st = document.documentElement.style;
  for (var k in t) st.setProperty('--' + k, t[k]);
  document.documentElement.setAttribute('data-theme', id);
})();
</script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root{
    --bg:#0a0a0c; --panel:#131317; --hover:#1b1b21; --line:#26262d; --line2:#38383f;
    --ink:#ececef; --dim:#86868f; --dim2:#5c5c66; --accent:#e0332f;
  }

  body {
    min-height: 100vh;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    -webkit-font-smoothing: antialiased;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 40px 22px;
    transition: background .25s ease, color .25s ease;
  }

  .seal {
    width: 72px;
    height: 72px;
    display: block;
    margin-bottom: 22px;
  }

  h1 {
    font-family: "Songti SC", "STSong", "SimSun", serif;
    font-size: 30px;
    font-weight: 700;
    letter-spacing: 4px;
    margin-bottom: 10px;
  }

  .sub {
    font-size: 13px;
    color: var(--dim);
    letter-spacing: 1px;
    margin-bottom: 38px;
  }

  .links {
    display: flex;
    flex-direction: column;
    gap: 10px;
    width: 100%;
    max-width: 300px;
  }

  .item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 15px 16px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 10px;
    color: inherit;
    text-decoration: none;
    font-size: 15px;
    font-family: inherit;
    text-align: left;
    cursor: pointer;
    transition: border-color .18s, background .18s;
  }
  .item:hover { background: var(--hover); border-color: var(--line2); }

  .item .ic {
    width: 30px;
    height: 30px;
    flex-shrink: 0;
    display: grid;
    place-items: center;
    border-radius: 6px;
    border: 1.5px solid currentColor;
  }
  .item .ic svg { width: 15px; height: 15px; }
  .ic.a { color: #6fb3d9; background: rgba(111,179,217,.1); }
  .ic.b { color: #9b8ec4; background: rgba(155,142,196,.1); }
  .ic.c { color: #5aa9ff; background: rgba(90,169,255,.1); }
  .ic.d { color: #d9a05b; background: rgba(217,160,91,.1); }

  .item .txt { flex: 1; min-width: 0; }
  .item .tag {
    font-size: 11px;
    color: var(--accent);
    border: 1px solid color-mix(in srgb, var(--accent) 40%, transparent);
    border-radius: 4px;
    padding: 2px 6px;
    display: inline-flex;
    align-items: center;
    gap: 3px;
  }
  .item .tag svg { width: 9px; height: 9px; }

  footer {
    margin-top: 44px;
    font-size: 11.5px;
    color: var(--dim2);
  }

  /* 主题按钮 */
  .theme-btn {
    position: fixed; right: 18px; bottom: 18px;
    width: 44px; height: 44px; border-radius: 50%;
    display: grid; place-items: center;
    background: var(--panel); border: 1px solid var(--line);
    color: var(--dim); cursor: pointer;
    box-shadow: 0 6px 20px rgba(0,0,0,.18);
    transition: color .18s, border-color .18s, background .18s;
    z-index: 40;
  }
  .theme-btn:hover { color: var(--ink); border-color: var(--line2); }
  .theme-btn svg { width: 19px; height: 19px; }

  .sheet {
    position: fixed; inset: 0; z-index: 60;
    display: none; align-items: flex-end; justify-content: center;
    background: rgba(0,0,0,.5);
    padding: 0;
  }
  .sheet.show { display: flex; }
  .sheet-box {
    width: 100%; max-width: 520px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 14px 14px 0 0;
    padding: 18px 18px 26px;
    max-height: 88vh;
    overflow-y: auto;
    animation: rise .22s ease-out;
  }
  @keyframes rise { from { transform: translateY(14px); opacity: .6; } to { transform: none; opacity: 1; } }
  .sheet-head {
    display: flex; align-items: center; gap: 10px; margin-bottom: 14px;
  }
  .sheet-head h2 { font-size: 14px; font-weight: 600; flex: 1; letter-spacing: .04em; }
  .sheet-head .close {
    width: 32px; height: 32px; border-radius: 8px; display: grid; place-items: center;
    background: transparent; border: 1px solid var(--line); color: var(--dim); cursor: pointer;
  }
  .sheet-head .close:hover { color: var(--ink); border-color: var(--line2); }

  .themes { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
  .theme {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 12px; border-radius: 9px;
    border: 1px solid var(--line); background: var(--bg);
    color: var(--ink); font-size: 13px; font-family: inherit;
    cursor: pointer; text-align: left;
    transition: border-color .16s, background .16s;
  }
  .theme:hover { border-color: var(--line2); }
  .theme[aria-pressed="true"] { border-color: var(--accent); }
  .theme .sw {
    width: 22px; height: 22px; border-radius: 6px; flex: none;
    border: 1px solid rgba(128,128,128,.28);
    display: grid; place-items: center;
  }
  .theme .sw i { width: 8px; height: 8px; border-radius: 50%; display: block; }
  .theme .nm { flex: 1; }
  .theme .ck { color: var(--accent); font-size: 12px; opacity: 0; }
  .theme[aria-pressed="true"] .ck { opacity: 1; }

  /* 密码弹窗 */
  .modal {
    position: fixed;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 20px;
    background: rgba(0,0,0,.72);
    backdrop-filter: blur(3px);
    z-index: 50;
  }
  .modal.show { display: flex; }

  .card {
    width: 100%;
    max-width: 330px;
    background: var(--panel);
    border: 1px solid var(--line2);
    border-radius: 12px;
    padding: 22px;
  }
  .card h2 {
    font-size: 15px;
    font-weight: 600;
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .card h2 svg { color: var(--accent); flex-shrink: 0; }

  #pw {
    width: 100%;
    padding: 11px 13px;
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 8px;
    color: var(--ink);
    font-size: 16px;
    font-family: inherit;
    outline: none;
  }
  #pw:focus { border-color: var(--accent); }

  .err {
    height: 17px;
    margin-top: 6px;
    font-size: 12px;
    color: #ff6b66;
    opacity: 0;
    transition: opacity .15s;
  }
  .err.show { opacity: 1; }

  .acts { display: flex; gap: 9px; margin-top: 6px; }
  .btn {
    flex: 1;
    padding: 10px;
    font-size: 13.5px;
    font-family: inherit;
    border-radius: 8px;
    cursor: pointer;
    border: 1px solid var(--line);
    background: transparent;
    color: var(--dim);
    transition: color .18s, border-color .18s;
  }
  .btn:hover { color: var(--ink); border-color: var(--line2); }
  .btn.primary {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
    font-weight: 600;
  }
  .btn.primary:hover { filter: brightness(1.08); }

  @keyframes shake {
    0%,100% { transform: translateX(0); }
    25% { transform: translateX(-6px); }
    75% { transform: translateX(6px); }
  }
  .shake { animation: shake .3s; }

  @media (max-width: 480px) {
    .sub { font-size: 14px; }
    .themes { grid-template-columns: 1fr; }
    .sheet-box { padding: 16px 16px 24px; }
  }

  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>

<img class="seal" src="assets/avatar.png" alt="杜绝加密">
<h1>杜绝加密</h1>
<p class="sub">站点整理中</p>

<div class="links">
  <a class="item" href="https://radio.mydjjm.cn" target="_blank" rel="noopener">
    <span class="ic a">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="22"/>
      </svg>
    </span>
    <span class="txt">电台</span>
  </a>

  <button class="item" type="button" id="treeBtn">
    <span class="ic b">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 21h18M5 21V7l7-4 7 4v14M9 21v-6h6v6"/>
      </svg>
    </span>
    <span class="txt">族谱</span>
    <span class="tag">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
      加密
    </span>
  </button>

  <a class="item" href="/media/">
    <span class="ic d">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="4" width="18" height="16" rx="2.5"/><path d="M7 4v16M17 4v16M3 9h4M3 15h4M17 9h4M17 15h4"/><path d="M11 10l3.5 2-3.5 2z" fill="currentColor" stroke="none"/>
      </svg>
    </span>
    <span class="txt">影视导航</span>
  </a>
</div>

<footer>© 2026 杜绝加密</footer>

<button class="theme-btn" id="themeBtn" type="button" aria-label="切换主题" aria-haspopup="dialog">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="2.4"/>
    <path d="M12 3v3M12 18v3M3 12h3M18 12h3"/>
  </svg>
</button>

<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
  <div class="sheet-box">
    <div class="sheet-head">
      <h2 id="sheetTitle">页面主题</h2>
      <button class="close" id="sheetClose" type="button" aria-label="关闭">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
    <div class="themes" id="themes"></div>
  </div>
</div>

<div class="modal" id="modal" role="dialog" aria-modal="true">
  <div class="card" id="card">
    <h2>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
      族谱需要密码
    </h2>
    <input id="pw" type="password" placeholder="密码" autocomplete="off" spellcheck="false">
    <div class="err" id="err">密码不对，再试一次</div>
    <div class="acts">
      <button class="btn" type="button" id="btnCancel">取消</button>
      <button class="btn primary" type="button" id="btnOk">打开</button>
    </div>
  </div>
</div>

<script>
/* 族谱链接以 AES-GCM 加密保存，源码中没有密码与真实地址 */
const ENC = { salt: 'fyfZqoWZ7Tv60rKHi7k1HQ==', iv: 'llH2E/skyASQZf3i', ct: 'nnsy+QejN/a4SQkv5rHFVE8blhxMIM50P01lmlF13tMP7h10s+g=', iter: 210000 };

const modal = document.getElementById('modal');
const card = document.getElementById('card');
const pw = document.getElementById('pw');
const err = document.getElementById('err');

function b64ToBytes(b64) {
  const bin = atob(b64);
  const out = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
  return out;
}

async function decryptUrl(password) {
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(password), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey(
    { name: 'PBKDF2', salt: b64ToBytes(ENC.salt), iterations: ENC.iter, hash: 'SHA-256' },
    base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']
  );
  const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64ToBytes(ENC.iv) }, key, b64ToBytes(ENC.ct));
  return new TextDecoder().decode(plain);
}

function openModal() {
  pw.value = '';
  err.classList.remove('show');
  modal.classList.add('show');
  setTimeout(() => pw.focus(), 50);
}
function closeModal() { modal.classList.remove('show'); }

async function submit() {
  const v = pw.value;
  if (!v) { pw.focus(); return; }
  err.classList.remove('show');

  if (!(window.crypto && crypto.subtle)) {
    err.textContent = '当前环境不支持解密，请用 https 访问';
    err.classList.add('show');
    return;
  }

  try {
    const url = await decryptUrl(v);
    closeModal();
    window.open(url, '_blank', 'noopener');
  } catch (e) {
    err.textContent = '密码不对，再试一次';
    err.classList.add('show');
    card.classList.add('shake');
    setTimeout(() => card.classList.remove('shake'), 320);
    pw.select();
  }
}

document.getElementById('treeBtn').addEventListener('click', openModal);
document.getElementById('btnOk').addEventListener('click', submit);
document.getElementById('btnCancel').addEventListener('click', closeModal);
pw.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); submit(); } });
modal.addEventListener('click', e => { if (e.target === modal) closeModal(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });
</script>

<script>
/* 主题切换：8 套配色，存在 localStorage，与影视导航页共用同一个键 */
(function () {
  const NAMES = [
    ['charcoal', '炭黑', '#0a0a0c', '#e0332f'],
    ['indigo',   '靛蓝', '#080b14', '#5b8cff'],
    ['forest',   '墨绿', '#07110c', '#34b37a'],
    ['cocoa',    '暖棕', '#120f0b', '#d98b4a'],
    ['violet',   '紫罗兰', '#0d0916', '#a06bff'],
    ['teal',     '青灰', '#0a0f12', '#38b8ae'],
    ['amber',    '琥珀', '#100d06', '#e0a92b'],
    ['paper',    '灰白', '#f5f4f1', '#c0392b']
  ];

  const btn = document.getElementById('themeBtn');
  const sheet = document.getElementById('sheet');
  const list = document.getElementById('themes');
  const closeBtn = document.getElementById('sheetClose');
  const T = window.__THEMES;

  function current() {
    try { return localStorage.getItem('site.theme') || 'charcoal'; } catch (e) { return 'charcoal'; }
  }

  function apply(id) {
    const t = T[id] || T.charcoal;
    const st = document.documentElement.style;
    for (const k in t) st.setProperty('--' + k, t[k]);
    document.documentElement.setAttribute('data-theme', id);
    try { localStorage.setItem('site.theme', id); } catch (e) {}
    for (const el of list.children) {
      el.setAttribute('aria-pressed', String(el.dataset.id === id));
    }
  }

  function build() {
    list.innerHTML = '';
    for (const [id, name, bg, accent] of NAMES) {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'theme';
      b.dataset.id = id;
      b.setAttribute('aria-pressed', String(current() === id));
      b.innerHTML =
        '<span class="sw" style="background:' + bg + '"><i style="background:' + accent + '"></i></span>' +
        '<span class="nm">' + name + '</span><span class="ck">✓</span>';
      b.addEventListener('click', () => { apply(id); });
      list.appendChild(b);
    }
  }

  function open() { build(); sheet.classList.add('show'); }
  function close() { sheet.classList.remove('show'); }

  btn.addEventListener('click', open);
  closeBtn.addEventListener('click', close);
  sheet.addEventListener('click', e => { if (e.target === sheet) close(); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && sheet.classList.contains('show')) close(); });

  apply(current());
})();
</script>
