<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>影视导航 · MovieNav</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  :root{
    --bg:#080b12;
    --card:rgba(255,255,255,.045);
    --card-hover:rgba(255,255,255,.085);
    --border:rgba(255,255,255,.08);
    --text:#e8ecf4;
    --muted:#8b95a8;
    --accent:#5b8cff;
  }
  html{scroll-behavior:smooth}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    background:var(--bg);
    color:var(--text);
    min-height:100vh;
    padding:0 22px 70px;
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
  }
  body::before{
    content:'';
    position:fixed;inset:0;z-index:-1;pointer-events:none;
    background:
      radial-gradient(900px 520px at 12% -12%, rgba(91,140,255,.20), transparent 62%),
      radial-gradient(760px 440px at 88% -4%, rgba(178,91,255,.16), transparent 62%),
      radial-gradient(900px 620px at 50% 112%, rgba(0,200,170,.10), transparent 62%);
  }

  /* ---------- Header ---------- */
  header{max-width:1240px;margin:0 auto;padding:70px 0 0;text-align:center}
  .badge{
    display:inline-flex;align-items:center;gap:7px;
    font-size:12.5px;letter-spacing:.06em;
    color:#a9b6d0;
    background:rgba(255,255,255,.05);
    border:1px solid var(--border);
    border-radius:999px;padding:6px 14px;
    backdrop-filter:blur(8px);
  }
  h1{
    font-size:clamp(30px,5vw,46px);
    font-weight:800;letter-spacing:-.02em;
    margin-top:20px;
    background:linear-gradient(180deg,#fff 30%,#93a3c4);
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .sub{margin-top:12px;color:var(--muted);font-size:14.5px}

  .search{
    display:flex;align-items:center;gap:11px;
    max-width:540px;margin:30px auto 0;
    background:rgba(255,255,255,.05);
    border:1px solid var(--border);
    border-radius:15px;
    padding:13px 16px;
    transition:.25s ease;
    backdrop-filter:blur(10px);
  }
  .search:focus-within{
    border-color:rgba(91,140,255,.65);
    background:rgba(255,255,255,.075);
    box-shadow:0 0 0 4px rgba(91,140,255,.13);
  }
  .search svg{flex:0 0 18px;stroke:var(--muted);transition:.25s}
  .search:focus-within svg{stroke:var(--accent)}
  .search input{
    flex:1;background:none;border:none;outline:none;
    color:var(--text);font-size:15px;font-family:inherit;
  }
  .search input::placeholder{color:#5f6a80}
  kbd{
    font-family:inherit;font-size:11.5px;color:#7f8aa0;
    border:1px solid var(--border);border-bottom-width:2px;
    border-radius:6px;padding:2px 7px;background:rgba(255,255,255,.04);
  }

  /* ---------- Tabs ---------- */
  .tabs{
    display:flex;flex-wrap:wrap;gap:9px;justify-content:center;
    max-width:900px;margin:30px auto 0;
  }
  .tab{
    font-family:inherit;font-size:13.5px;cursor:pointer;
    color:#a4b0c6;
    background:rgba(255,255,255,.04);
    border:1px solid var(--border);
    border-radius:999px;
    padding:8px 16px;
    transition:.22s ease;
    display:inline-flex;align-items:center;gap:7px;
  }
  .tab:hover{color:#fff;background:rgba(255,255,255,.085);transform:translateY(-1px)}
  .tab .n{font-size:11px;opacity:.6}
  .tab.active{
    color:#fff;
    background:linear-gradient(135deg,#4a7dff,#8b5cf6);
    border-color:transparent;
    box-shadow:0 8px 22px -10px rgba(91,140,255,.9);
  }
  .tab.active .n{opacity:.85}

  /* ---------- Grid ---------- */
  .grid{
    max-width:1240px;margin:38px auto 0;
    display:grid;gap:14px;
    grid-template-columns:repeat(auto-fill,minmax(272px,1fr));
  }
  .card{
    --c:#5b8cff;
    position:relative;overflow:hidden;
    display:flex;gap:13px;align-items:flex-start;
    padding:16px;
    background:var(--card);
    border:1px solid var(--border);
    border-radius:16px;
    text-decoration:none;color:inherit;
    transition:transform .22s ease,background .22s ease,border-color .22s ease,box-shadow .22s ease;
    animation:rise .5s cubic-bezier(.22,1,.36,1) backwards;
  }
  .card::after{
    content:'';position:absolute;inset:0;pointer-events:none;
    background:radial-gradient(420px 130px at 0% 0%, var(--c), transparent 72%);
    opacity:0;transition:opacity .3s ease;
  }
  .card:hover{
    transform:translateY(-4px);
    background:var(--card-hover);
    border-color:rgba(255,255,255,.17);
    box-shadow:0 16px 38px -18px rgba(0,0,0,.85);
  }
  .card:hover::after{opacity:.09}
  .logo{
    flex:0 0 42px;width:42px;height:42px;border-radius:12px;
    display:grid;place-items:center;
    font-size:16px;font-weight:700;letter-spacing:-.02em;
    color:var(--c);
    background:rgba(255,255,255,.055);
    background:color-mix(in srgb, var(--c) 17%, rgba(255,255,255,.03));
    border:1px solid rgba(255,255,255,.08);
    border-color:color-mix(in srgb, var(--c) 32%, transparent);
    transition:transform .22s ease;
  }
  .card:hover .logo{transform:scale(1.06) rotate(-3deg)}
  .body{min-width:0;flex:1}
  .name{
    font-size:15px;font-weight:650;line-height:1.3;
    display:flex;align-items:center;gap:6px;
  }
  .name .cn{color:#7f8aa0;font-weight:400;font-size:12.5px}
  .arrow{
    font-size:11px;color:var(--muted);
    opacity:0;transform:translateX(-5px);
    transition:.22s ease;
  }
  .card:hover .arrow{opacity:1;transform:none}
  .desc{
    margin-top:5px;font-size:12.5px;line-height:1.55;color:var(--muted);
    overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
  }

  @keyframes rise{
    from{opacity:0;transform:translateY(14px)}
    to{opacity:1;transform:none}
  }

  /* ---------- Empty ---------- */
  .empty{
    grid-column:1/-1;text-align:center;padding:70px 0;color:var(--muted);
  }
  .empty .big{font-size:38px;margin-bottom:14px;opacity:.5}
  .empty p{font-size:14px}
  .empty button{
    margin-top:18px;font-family:inherit;font-size:13.5px;cursor:pointer;
    color:#fff;background:linear-gradient(135deg,#4a7dff,#8b5cf6);
    border:none;border-radius:10px;padding:9px 20px;
    box-shadow:0 8px 22px -10px rgba(91,140,255,.9);
  }

  /* ---------- Footer ---------- */
  footer{
    max-width:1240px;margin:64px auto 0;
    padding-top:26px;border-top:1px solid rgba(255,255,255,.07);
    text-align:center;font-size:12.5px;color:#5f6a80;line-height:1.9;
  }
  footer a{color:#7d8aa3;text-decoration:none;border-bottom:1px dashed rgba(125,138,163,.4)}
  footer a:hover{color:var(--accent);border-color:var(--accent)}

  @media (max-width:520px){
    body{padding:0 16px 50px}
    header{padding-top:48px}
    .grid{grid-template-columns:1fr;margin-top:28px}
    kbd{display:none}
  }
</style>
</head>
<body>

<header>
  <div class="badge">🎬 MovieNav</div>
  <h1>影视导航</h1>
  <p class="sub">精选全球流媒体平台、评分与资讯站点 · 一站直达</p>

  <div class="search">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round">
      <circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/>
    </svg>
    <input id="search" type="text" placeholder="搜索平台、类型或关键词…" autocomplete="off" spellcheck="false">
    <kbd>/</kbd>
  </div>
</header>

<nav class="tabs" id="tabs"></nav>

<main class="grid" id="grid"></main>

<footer>
  <div>仅收录正规授权的影视平台与公开资讯 / 评分网站，不提供任何资源下载或播放服务。</div>
  <div>© <span id="year"></span> MovieNav · 按 <kbd>/</kbd> 搜索 · 按 <kbd>Esc</kbd> 清空</div>
</footer>

  { name:'Variety',  cn:'',      cat:'资讯', color:'#c8102e', icon:'V',  url:'https://variety.com',            desc:'好莱坞权威娱乐商业媒体', kw:'好莱坞 产业 票房' },
  { name:'Deadline', cn:'',      cat:'资讯', color:'#e2231a', icon:'D',  url:'https://deadline.com',           desc:'影视产业快讯与奖项动态', kw:'奖项 产业 快讯' },
  { name:'The Hollywood Reporter', cn:'', cat:'资讯', color:'#e6002d', icon:'T', url:'https://www.hollywoodreporter.com', desc:'深度报道与颁奖季风向标', kw:'颁奖季 深度' },

  { name:'AniList',  cn:'',      cat:'动漫', color:'#02a9ff', icon:'A',  url:'https://anilist.co',             desc:'动漫追踪与评分社区，API 开放', kw:'追番 评分 番表' },
  { name:'MyAnimeList', cn:'',   cat:'动漫', color:'#2e51a2', icon:'M',  url:'https://myanimelist.net',        desc:'老牌动漫数据库与个人追番管理', kw:'数据库 追番' },

  { name:'BBC Earth', cn:'',     cat:'纪录片', color:'#00b4d8', icon:'B', url:'https://www.bbcearth.com',       desc:'BBC 自然历史部，顶级生态影像', kw:'自然 生态 BBC' },
  { name:'CuriosityStream', cn:'', cat:'纪录片', color:'#00c2a8', icon:'C', url:'https://curiositystream.com',  desc:'专注纪录片与科普的订阅平台', kw:'科普 订阅' },
  { name:'ARTE',     cn:'',      cat:'纪录片', color:'#ff5a00', icon:'A', url:'https://www.arte.tv',            desc:'欧洲公共文化频道，纪录片质量极高', kw:'欧洲 文化 公共' },

  /* --- 数据工具 --- */
  { name:'TMDB',     cn:'',      cat:'工具', color:'#01b4e4', icon:'T',  url:'https://www.themoviedb.org',     desc:'开放影视元数据库，海报与剧照齐全', kw:'数据库 API 海报' },

  { name:'Internet Archive', cn:'', cat:'免费', color:'#4a90d9', icon:'IA', url:'https://archive.org/details/movies', desc:'公共领域老电影与影像资料库', kw:'老电影 公共领域 资料' },
  { name:'1905 电影网', cn:'',   cat:'免费', color:'#e60012', icon:'19', url:'https://www.1905.com',           desc:'央视电影频道旗下，免费正版观影', kw:'免费 正版 央视' },
  { name:'Kanopy',   cn:'',      cat:'免费', color:'#ff7a00', icon:'K',  url:'https://www.kanopy.com',         desc:'凭图书馆卡免费观看艺术电影', kw:'图书馆 艺术片 免费' }
];

/* ================= 渲染逻辑 ================= */
const gridEl   = document.getElementById('grid');
const tabsEl   = document.getElementById('tabs');
const searchEl = document.getElementById('search');

const CATS = ['全部', ...new Set(SITES.map(s => s.cat))];
let currentCat = '全部';

/* 分类标签 */
CATS.forEach(cat => {
  const count = cat === '全部' ? SITES.length : SITES.filter(s => s.cat === cat).length;
  const btn = document.createElement('button');
  btn.className = 'tab' + (cat === '全部' ? ' active' : '');
  btn.dataset.cat = cat;
  btn.innerHTML = `${cat}<span class="n">${count}</span>`;
  btn.addEventListener('click', () => {
    currentCat = cat;
    document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.cat === cat));
    render();
  });
  tabsEl.appendChild(btn);
});

/* 卡片渲染 */
function render() {
  const q = searchEl.value.trim().toLowerCase();

  const list = SITES.filter(s => {
    const okCat = currentCat === '全部' || s.cat === currentCat;
    if (!okCat) return false;
    if (!q) return true;
    return (s.name + ' ' + s.cn + ' ' + s.desc + ' ' + s.cat + ' ' + s.kw)
      .toLowerCase().includes(q);
  });

  gridEl.innerHTML = '';

  if (!list.length) {
    gridEl.innerHTML = `
      <div class="empty">
        <div class="big">🔍</div>
        <p>没有找到「${escapeHtml(searchEl.value)}」相关的结果</p>
        <button onclick="resetAll()">重置筛选</button>
      </div>`;
    return;
  }

  const frag = document.createDocumentFragment();
  list.forEach((s, i) => {
    const a = document.createElement('a');
    a.className = 'card';
    a.href = s.url;
    a.target = '_blank';
    a.rel = 'noopener noreferrer';
    a.style.setProperty('--c', s.color);
    a.style.animationDelay = Math.min(i, 22) * 18 + 'ms';
    a.innerHTML = `
      <div class="logo">${s.icon}</div>
      <div class="body">
        <div class="name">${s.name}${s.cn ? `<span class="cn">${s.cn}</span>` : ''}<span class="arrow">↗</span></div>
        <div class="desc">${s.desc}</div>
      </div>`;
    frag.appendChild(a);
  });
  gridEl.appendChild(frag);
}

function resetAll() {
  searchEl.value = '';
  currentCat = '全部';
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.cat === '全部'));
  render();
  searchEl.focus();
}

function escapeHtml(str) {
  return str.replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

/* 搜索事件 */
let timer;
searchEl.addEventListener('input', () => {
  clearTimeout(timer);
  timer = setTimeout(render, 90);
});

/* 快捷键 */
document.addEventListener('keydown', e => {
  if (e.key === '/' && document.activeElement !== searchEl) {
    e.preventDefault();
    searchEl.focus();
    searchEl.select();
  }
  if (e.key === 'Escape' && document.activeElement === searchEl) {
    searchEl.value = '';
    render();
    searchEl.blur();
  }
});

document.getElementById('year').textContent = new Date().getFullYear();

render();
</script>
</body>
</html>
